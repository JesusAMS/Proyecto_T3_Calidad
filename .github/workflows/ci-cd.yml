name: CI-CD Sistema Academico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-y-construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v

      - name: Construir imagen Docker
        run: docker build -t sistema-academico-t3 .

      - name: Ejecutar contenedor
        run: |
          docker run -d --name sistema-academico -p 5000:5000 sistema-academico-t3
          sleep 5

      - name: Verificar endpoint de salud
        run: curl --fail http://localhost:5000/salud

      - name: Mostrar resultado del contenedor
        if: always()
        run: |
          docker ps -a
          docker logs sistema-academico || true
          docker stop sistema-academico || true
